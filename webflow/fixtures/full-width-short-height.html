<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmashBurger Full-width short-height fixture</title>
  <link rel="stylesheet" href="../../candidate/dist/navbar-light.css">
  <script defer src="../../candidate/dist/navbar-light.js"></script>
  <style>
    body { margin: 0; font: 16px/1.5 Arial, sans-serif; }
    main { min-height: 140vh; }
    [data-mwp-navbar] { background: #17231d; color: white; padding: 1rem; }
    .sb-nav-inner { align-items: center; display: flex; justify-content: space-between; }
    [data-mwp-trigger] { padding: 0.5rem 0.75rem; }
    [data-mwp-panel] { background: white; color: #1d2022; }
    [data-mwp-panel] a { display: block; padding: 0.75rem 1rem; }
    #contact { margin-top: 1rem; min-height: 3rem; }
  </style>
</head>
<body>
  <main>
    <header data-mwp-navbar data-collapse="always" data-layout="full-width" data-motion="dropdown" data-presets="false" aria-label="SmashBurger fixture navigation">
      <div class="sb-nav-inner">
        <strong>SmashBurger</strong>
        <details data-mwp-menu>
          <summary data-mwp-trigger>Menu</summary>
        </details>
        <nav data-mwp-panel aria-label="Main navigation">
          <a href="#home">Home</a>
          <a href="#menu">Our menu</a>
          <a href="#offers">Offers</a>
          <a href="#restaurants">Restaurants</a>
          <a href="#careers">Careers</a>
          <a href="#about">About us</a>
          <a href="#news">News</a>
          <a href="#allergens">Allergens</a>
          <a href="#nutrition">Nutrition</a>
          <a href="#contact">Contact us</a>
        </nav>
      </div>
    </header>
    <section id="home"><h1>Full-width menu fixture</h1><p>Open Menu to inspect the long link list.</p></section>
    <section id="menu"><h2>Our menu</h2></section>
    <section id="offers"><h2>Offers</h2></section>
    <section id="restaurants"><h2>Restaurants</h2></section>
    <section id="careers"><h2>Careers</h2></section>
    <section id="about"><h2>About us</h2></section>
    <section id="news"><h2>News</h2></section>
    <section id="allergens"><h2>Allergens</h2></section>
    <section id="nutrition"><h2>Nutrition</h2></section>
    <section id="contact"><h2>Contact us</h2><p>Final menu link destination.</p></section>
  </main>
</body>
</html>
